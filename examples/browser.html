<!doctype html>
<!--
  Complete chat UI built with the webchatagent SDK, no framework, no build step.

    npm run build
    npx serve .            (or: python3 -m http.server 8080)
    open http://localhost:3000/examples/browser.html?chatbotId=<your-chatbot-id>

  Optional: &baseUrl=https://your-white-label-domain, &language=en. Open it via http://localhost, not file://:
  the API checks where requests come from.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebChatAgent SDK demo</title>
  <style>
    :root {
      --accent: #4f46e5; --accent-2: #7c3aed; --surface: #fff; --soft: #f1f5f9; --line: #e2e8f0; --text: #0f172a; --muted: #64748b;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    body {
      margin: 0; min-height: 100dvh; display: grid; place-items: center; color: var(--text);
      background: radial-gradient(900px 500px at 0% 0%, #c7d2fe 0, transparent 60%), radial-gradient(900px 500px at 100% 100%, #e9d5ff 0, transparent 60%), #f8fafc;
    }
    .chat { display: flex; flex-direction: column; width: 100%; height: 100dvh; max-width: 760px; background: var(--surface); }
    @media (min-width: 800px) {
      .chat { height: min(860px, calc(100dvh - 48px)); border-radius: 24px; overflow: hidden; box-shadow: 0 30px 80px -24px rgb(30 41 59 / .4), 0 0 0 1px rgb(15 23 42 / .06); }
    }
    header { display: flex; align-items: center; gap: 12px; padding: 16px 20px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
    header img, #avatar-fallback {
      flex: none; width: 42px; height: 42px; border-radius: 50%; object-fit: cover; display: grid; place-items: center;
      font-weight: 700; background: rgb(255 255 255 / .2); box-shadow: 0 0 0 2px rgb(255 255 255 / .45);
    }
    header div { flex: 1; min-width: 0; }
    h1 { font-size: 1.05rem; font-weight: 650; margin: 0; }
    #state { display: flex; align-items: center; gap: 6px; font-size: .8rem; color: rgb(255 255 255 / .85); }
    #state::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 0 3px rgb(74 222 128 / .3); }
    button {
      font: inherit; cursor: pointer; min-height: 36px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line);
      background: #fff; color: var(--text); transition: border-color .15s, background .15s, transform .1s;
    }
    button:hover { border-color: var(--accent); }
    button:active { transform: scale(.97); }
    header button { color: #fff; background: rgb(255 255 255 / .14); border-color: rgb(255 255 255 / .35); }
    header button:hover { background: rgb(255 255 255 / .24); border-color: #fff; }
    .icon { width: 40px; height: 40px; min-height: 40px; padding: 0; display: grid; place-items: center; border-radius: 50%; }
    .icon svg { width: 18px; height: 18px; }
    #messages {
      flex: 1; overflow-y: auto; list-style: none; margin: 0; padding: 24px 20px; display: flex; flex-direction: column; gap: 12px;
      background: linear-gradient(var(--soft), var(--surface) 240px);
    }
    #messages > li { max-width: 82%; padding: 10px 14px; border-radius: 18px; line-height: 1.55; overflow-wrap: anywhere; animation: rise .25s ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
    #messages > li.user {
      align-self: flex-end; color: #fff; border-bottom-right-radius: 6px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 8px 18px -10px var(--accent);
    }
    #messages > li.user a { color: inherit; }
    #messages > li.user.pending { opacity: .6; }
    #messages > li.user.failed { background: #b91c1c; }
    #messages > li.bot, #messages > li.agent {
      align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px;
      box-shadow: 0 6px 16px -12px rgb(15 23 42 / .35);
    }
    #messages > li.agent { border-left: 3px solid #16a34a; }
    #messages > li.system { align-self: center; padding: 2px 10px; font-size: .8rem; color: var(--muted); }
    li p { margin: .3em 0; }
    #messages ul, #messages ol { margin: .3em 0; padding-left: 20px; }
    li img { max-width: 100%; border-radius: 10px; }
    #messages a { color: var(--accent); }
    #messages code { padding: 1px 6px; border-radius: 6px; font-size: .85em; background: var(--soft); }
    .meta { display: inline-block; margin-top: 8px; padding: 2px 8px; border-radius: 999px; font-size: .7rem; color: var(--muted); background: var(--soft); }
    .sources a { display: inline-block; margin: 8px 6px 0 0; padding: 3px 10px; border-radius: 999px; font-size: .75rem; text-decoration: none; background: #eef2ff; }
    .rating { display: flex; gap: 4px; margin-top: 8px; }
    .rating button { min-height: 28px; padding: 2px 10px; font-size: .85rem; }
    .rating button[aria-pressed="true"] { border-color: var(--accent); background: #eef2ff; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 20px 10px; }
    .chips button { font-size: .85rem; color: var(--accent); border-color: color-mix(in srgb, var(--accent) 35%, transparent); background: color-mix(in srgb, var(--accent) 6%, #fff); }
    #attachment { color: var(--muted); font-size: .8rem; }
    .notice { margin: 0; padding: 10px 20px; font-size: .8rem; color: var(--muted); background: var(--soft); border-bottom: 1px solid var(--line); }
    .notice summary { cursor: pointer; }
    .notice.error { background: #fef2f2; color: #991b1b; }
    #typing { margin: 0 20px 8px; color: var(--muted); font-size: .8rem; }
    .dots i { display: inline-block; width: 7px; height: 7px; margin-right: 4px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite both; }
    .dots i:nth-child(2) { animation-delay: .2s; }
    .dots i:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
    #composer {
      display: flex; align-items: center; gap: 6px; margin: 6px 16px 16px; padding: 6px; border: 1px solid var(--line); border-radius: 999px;
      background: #fff; box-shadow: 0 10px 24px -18px rgb(15 23 42 / .5); transition: border-color .15s, box-shadow .15s;
    }
    #composer:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 15%, transparent); }
    #input { flex: 1; min-width: 0; padding: 8px 10px; font: inherit; border: 0; outline: none; background: transparent; }
    #send { border: 0; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
    #attach, #stop { border-color: transparent; color: var(--muted); }
    footer { padding: 0 16px 12px; text-align: center; font-size: .75rem; }
    footer a { color: var(--muted); text-decoration: none; }
    dialog { border: 0; border-radius: 20px; width: min(420px, calc(100vw - 32px)); padding: 24px; box-shadow: 0 30px 80px -20px rgb(15 23 42 / .5); }
    dialog::backdrop { background: rgb(15 23 42 / .35); backdrop-filter: blur(2px); }
    dialog h2 { margin: 0 0 16px; font-size: 1.1rem; }
    dialog label { display: block; margin: 0 0 12px; font-size: .9rem; }
    dialog input:not([type=checkbox]), dialog select, dialog textarea {
      display: block; width: 100%; margin-top: 4px; padding: 8px 10px; font: inherit; border: 1px solid var(--line); border-radius: 10px;
    }
    dialog menu { display: flex; justify-content: flex-end; gap: 8px; padding: 0; margin: 16px 0 0; }
    button.primary { border: 0; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
  </style>
</head>
<body>
  <main class="chat">
    <header>
      <img id="avatar" alt="" hidden>
      <span id="avatar-fallback" aria-hidden="true">C</span>
      <div>
        <h1 id="title">Chat</h1>
        <small id="state">Loading…</small>
      </div>
      <button type="button" id="end-live" hidden>End live chat</button>
      <button type="button" id="reset">New chat</button>
    </header>
    <p id="error" class="notice error" role="alert" hidden></p>
    <details id="privacy" class="notice" hidden><summary>Privacy notice</summary><div></div></details>
    <ol id="messages" aria-live="polite"></ol>
    <small id="typing" hidden>A team member is typing…</small>
    <div id="suggestions" class="chips"></div>
    <div id="actions" class="chips"></div>
    <small id="attachment" class="chips" hidden></small>
    <form id="composer">
      <input id="file" type="file" hidden>
      <button type="button" id="attach" class="icon" aria-label="Attach a file" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
      </button>
      <input id="input" maxlength="700" placeholder="Ask anything…" autocomplete="off" aria-label="Message">
      <button type="button" id="stop" class="icon" aria-label="Stop" hidden>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
      <button id="send" class="icon" aria-label="Send">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
    <footer id="branding" hidden><a target="_blank" rel="noopener"></a></footer>
  </main>
  <dialog id="dialog"><form method="dialog" id="dialog-form"></form></dialog>

  <script type="module">
    import { marked } from 'https://cdn.jsdelivr.net/npm/marked@18.0.14/lib/marked.esm.js'
    import DOMPurify from 'https://cdn.jsdelivr.net/npm/dompurify@3.4.16/dist/purify.es.mjs'
    import { WebChatAgent, WebChatAgentError, MAX_MESSAGE_LENGTH } from '../dist/index.js'

    const $ = (id) => document.getElementById(id)
    const params = new URLSearchParams(location.search)
    const SYSTEM_TEXT = { agent_joined: 'A team member joined the chat.', ended: 'The live chat has ended.', timeout: 'Nobody was available. The assistant continues.' }
    const LIVE_LABEL = { waiting: 'Waiting for a team member…', open: 'Chatting with a team member' }
    const shown = new Set() // server message IDs already rendered
    let chat, config, live = null, attachment = null, controller = null, typingTimer

    const markdown = (text) => DOMPurify.sanitize(marked.parse(text, { async: false }))
    const scroll = () => { $('messages').scrollTop = $('messages').scrollHeight }

    function showError(error) {
      if (error?.name === 'AbortError') return
      $('error').textContent = error instanceof WebChatAgentError ? error.message : String(error)
      $('error').hidden = false
    }

    function addMessage(role, { text = '', html, file, id } = {}) {
      if (id != null) shown.add(id)
      const li = document.createElement('li')
      li.className = role
      const body = document.createElement('div')
      if (html !== undefined) body.innerHTML = html
      else body.textContent = text
      li.append(body)
      if (file) {
        const link = Object.assign(document.createElement('a'), { href: file.url, target: '_blank', rel: 'noopener' })
        if (file.isImage) link.append(Object.assign(document.createElement('img'), { src: file.url, alt: file.name }))
        else link.textContent = `📎 ${file.name}`
        li.append(link)
      }
      $('messages').append(li)
      scroll()
      return li
    }

    // History messages and live chat messages share role, text, file and event.
    function renderMessage(message) {
      if (message.id != null && shown.has(message.id)) return
      const { id, role, text, file, event } = message
      if (role === 'system') return event && addMessage('system', { text: SYSTEM_TEXT[event], id })
      if (role === 'user') return addMessage('user', { text, file, id })
      const li = addMessage(role === 'agent' ? 'agent' : 'bot', { html: markdown(text), file, id })
      if (role === 'assistant') renderBotDetails(li, message, true)
    }

    function renderBotDetails(li, message, aiGenerated) {
      if (aiGenerated) li.insertAdjacentHTML('beforeend', '<div class="meta">AI-generated</div>')
      const links = message.sources.filter((s) => s.type === 'web')
      if (links.length) {
        const list = document.createElement('div')
        list.className = 'sources'
        for (const s of links) {
          const url = new URL(s.source)
          list.append(Object.assign(document.createElement('a'), { href: url.href, target: '_blank', rel: 'noopener', textContent: url.hostname + url.pathname.replace(/\/$/, '') }))
        }
        li.append(list)
      }
      if (config.features.feedback && aiGenerated) {
        const rating = document.createElement('div')
        rating.className = 'rating'
        for (const [value, label] of [['up', '👍'], ['down', '👎']]) {
          const button = Object.assign(document.createElement('button'), { type: 'button', textContent: label, ariaLabel: value === 'up' ? 'Helpful' : 'Not helpful' })
          button.setAttribute('aria-pressed', 'false')
          button.onclick = async () => {
            try {
              await chat.feedback(message, value)
              rating.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === button)))
            } catch (error) { showError(error) }
          }
          rating.append(button)
        }
        li.append(rating)
      }
    }

    function renderSuggestions(items) {
      $('suggestions').replaceChildren(...items.map(({ label, text }) => {
        const button = Object.assign(document.createElement('button'), { type: 'button', textContent: label })
        button.onclick = () => submit(text)
        return button
      }))
    }

    function setLiveUi(status) {
      const active = status === 'waiting' || status === 'open'
      $('end-live').hidden = !active
      $('human')?.toggleAttribute('hidden', active)
      $('state').textContent = LIVE_LABEL[status] ?? 'Assistant'
    }

    function openLiveChat() {
      if (live?.active) return
      live = chat.liveChat()
      setLiveUi('waiting')
      live.on('status', ({ status }) => setLiveUi(status))
      live.on('ready', () => setLiveUi(live.status))
      live.on('disconnected', () => { $('state').textContent = 'Reconnecting…' })
      // Includes messages missed during a reconnect. Own messages are rendered when sent.
      live.on('message', (m) => { if (m.role !== 'user') renderMessage(m) })
      live.on('typing', (isTyping) => { $('typing').hidden = !isTyping })
      live.on('ended', () => {
        $('typing').hidden = true
        addMessage('system', { text: SYSTEM_TEXT.ended })
        setLiveUi(null)
      })
    }

    async function submit(text) {
      text = text.trim()
      if ((!text && !attachment) || controller) return
      $('error').hidden = true
      $('input').value = ''
      renderSuggestions([])

      if (live?.canSend) {
        const li = addMessage('user', { text })
        li.classList.add('pending')
        try { shown.add((await live.send(text)).id); li.classList.remove('pending') }
        catch (error) { li.classList.replace('pending', 'failed'); showError(error) }
        return
      }

      addMessage('user', { text, file: attachment })
      const options = attachment ? { attachment } : {}
      attachment = null
      $('attachment').hidden = true
      const li = addMessage('bot', { html: '<span class="dots" aria-label="Writing"><i></i><i></i><i></i></span>' })
      const body = li.firstChild
      let latest = null, frame = 0
      controller = new AbortController()
      $('stop').hidden = false
      try {
        for await (const event of chat.stream(text, { ...options, signal: controller.signal })) {
          if (event.type === 'text') {
            // Render at most once per frame: Markdown + sanitizing the whole answer on every token is wasted work.
            latest = event.text
            frame ||= requestAnimationFrame(() => { frame = 0; body.innerHTML = markdown(latest); scroll() })
          }
          if (event.type === 'done') {
            cancelAnimationFrame(frame)
            const { reply } = event
            if (reply.mode === 'human') {
              if (reply.text) body.innerHTML = markdown(reply.text)
              else li.remove()
              openLiveChat()
              continue
            }
            body.innerHTML = markdown(reply.text)
            renderBotDetails(li, reply, reply.aiGenerated)
            renderSuggestions(reply.suggestions)
            if (reply.attachmentTruncated) addMessage('system', { text: 'Only the beginning of the file was read.' })
            if (reply.conversationTooLong) addMessage('system', { text: 'This conversation is full. Start a new chat to continue.' })
          }
        }
      } catch (error) {
        cancelAnimationFrame(frame)
        body.textContent = error?.name === 'AbortError' ? 'Stopped.' : 'Sorry, something went wrong.'
        showError(error)
      } finally {
        controller = null
        $('stop').hidden = true
        scroll()
      }
    }

    // The browser validates required and e-mail fields before onSubmit runs; the SDK checks again.
    function openDialog(title, fields, submitLabel, onSubmit) {
      const form = $('dialog-form')
      form.replaceChildren(Object.assign(document.createElement('h2'), { textContent: title }))
      for (const field of fields) {
        if (field.type === 'info') { form.append(Object.assign(document.createElement('p'), { textContent: field.label })); continue }
        const label = document.createElement('label')
        label.append(field.label + (field.required ? ' *' : ''))
        let input
        if (field.type === 'textarea') input = document.createElement('textarea')
        else if (field.type === 'select') {
          input = document.createElement('select')
          input.append(new Option('', ''), ...(field.options ?? []).map((o) => new Option(o, o)))
        } else input = Object.assign(document.createElement('input'), { type: field.type === 'checkbox' ? 'checkbox' : field.type })
        Object.assign(input, { name: field.id, required: field.required, placeholder: field.placeholder ?? '' })
        label.append(input)
        form.append(label)
      }
      const menu = document.createElement('menu')
      menu.append(
        Object.assign(document.createElement('button'), { type: 'button', textContent: 'Cancel', onclick: () => $('dialog').close() }),
        Object.assign(document.createElement('button'), { className: 'primary', textContent: submitLabel }),
      )
      form.append(menu)
      form.onsubmit = async (event) => {
        event.preventDefault()
        const values = Object.fromEntries(fields.map((f) => {
          const input = form.elements.namedItem(f.id)
          return [f.id, !input ? undefined : input.type === 'checkbox' ? input.checked : input.value]
        }))
        try {
          await onSubmit(values)
          $('dialog').close()
        } catch (error) { showError(error) }
      }
      $('dialog').showModal()
    }

    async function requestHuman(values = {}) {
      const result = await chat.requestHuman(values)
      if (!result.ok) return addMessage('system', { text: 'Live chat is not available right now.' })
      addMessage('system', { text: 'We are getting a team member for you.' })
      openLiveChat()
    }

    function renderActions() {
      const buttons = config.forms.map((form) => {
        const button = Object.assign(document.createElement('button'), { type: 'button', textContent: form.name })
        button.onclick = () => openDialog(form.name, form.fields, form.submitLabel || 'Send', async (values) => {
          await chat.submitForm(form, values)
          addMessage('system', { text: form.successMessage || 'Thank you! We will get back to you.' })
        })
        return button
      })
      if (config.features.liveChat) {
        const human = Object.assign(document.createElement('button'), { type: 'button', id: 'human', textContent: 'Talk to a person' })
        const fields = [
          ...(config.features.askName ? [{ id: 'name', type: 'text', label: 'Name', required: true }] : []),
          ...(config.features.askEmail ? [{ id: 'email', type: 'email', label: 'E-mail', required: true }] : []),
        ]
        human.onclick = () => fields.length ? openDialog('Talk to a person', fields, 'Request', requestHuman) : requestHuman().catch(showError)
        buttons.push(human)
      }
      $('actions').replaceChildren(...buttons)
    }

    function welcome() {
      // welcomeMessage is HTML from the dashboard
      if (config.widget.welcomeMessage) addMessage('bot', { html: DOMPurify.sanitize(config.widget.welcomeMessage) })
      renderSuggestions((config.widget.promptButtons ?? []).map((b) => ({ label: b.title, text: b.action })))
    }

    async function start() {
      try {
        chat = new WebChatAgent({
          chatbotId: params.get('chatbotId') ?? '',
          baseUrl: params.get('baseUrl') ?? undefined,
          language: params.get('language') ?? undefined,
          storage: localStorage,
        })
      } catch (error) {
        $('state').textContent = 'Add ?chatbotId=<your chatbot ID> to the URL.'
        return showError(error)
      }
      const [loadedConfig, history, status] = await Promise.all([chat.getConfig(), chat.history(), chat.liveChatStatus()])
      config = loadedConfig
      if (config.archived) { $('state').textContent = 'This chat is not available.'; $('composer').hidden = true; return }
      const { widget } = config
      $('title').textContent = widget.title || 'Chat'
      $('state').textContent = 'Assistant'
      $('avatar-fallback').textContent = (widget.title || 'Chat').trim().charAt(0).toUpperCase()
      if (widget.avatarSrc) { Object.assign($('avatar'), { src: widget.avatarSrc, hidden: false }); $('avatar-fallback').hidden = true }
      if (widget.themeColor && !/^#f{3}(f{3})?$/i.test(widget.themeColor)) {
        for (const name of ['--accent', '--accent-2']) document.documentElement.style.setProperty(name, widget.themeColor)
      }
      if (widget.privacyPolicyHtml) { $('privacy').lastElementChild.innerHTML = DOMPurify.sanitize(widget.privacyPolicyHtml); $('privacy').hidden = false }
      if (config.branding.required) { Object.assign($('branding').firstElementChild, { href: config.branding.url, textContent: config.branding.text }); $('branding').hidden = false }
      $('attach').hidden = !config.features.fileUpload
      $('input').maxLength = MAX_MESSAGE_LENGTH
      renderActions()

      if (history.length) history.forEach(renderMessage)
      else welcome()
      if (status && status.status !== 'closed') openLiveChat()
    }

    $('composer').onsubmit = (event) => { event.preventDefault(); submit($('input').value) }
    $('stop').onclick = () => controller?.abort()
    $('end-live').onclick = () => live?.end().catch(showError)
    $('reset').onclick = () => {
      chat.reset()
      live = null
      shown.clear()
      $('messages').replaceChildren()
      setLiveUi(null)
      welcome()
    }
    $('input').oninput = () => {
      if (!live?.canSend) return
      live.typing(true) // repeats are not sent
      clearTimeout(typingTimer)
      typingTimer = setTimeout(() => live?.typing(false), 1500)
    }
    $('attach').onclick = () => $('file').click()
    $('file').onchange = async () => {
      const file = $('file').files?.[0]
      $('file').value = ''
      if (!file) return
      $('error').hidden = true
      try {
        if (live?.canSend) {
          const sent = await live.upload(file)
          addMessage('user', { file: sent, id: sent.messageId })
        } else {
          attachment = await chat.upload(file)
          Object.assign($('attachment'), { textContent: `📎 ${attachment.name} will be sent with your next message`, hidden: false })
        }
      } catch (error) { showError(error) }
    }

    start().catch(showError)
  </script>
</body>
</html>
